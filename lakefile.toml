name = "cgt"
version = "0.1.0"
defaultTargets = ["Cgt"]

[[lean_lib]]
name = "Cgt"

# Machine-generated strategy certificates for individual cases (slow to check; not built by default).
# Build with `lake build CgtCerts`.
[[lean_lib]]
name = "CgtCerts"
roots = ["Cgt.Cert.Case_3_4", "Cgt.Cert.Case_3_10", "Cgt.Cert.Case_2_17", "Cgt.Cert.Case_2_20",
  "Cgt.Cert.Case_2_24", "Cgt.Cert.Case_3_11", "Cgt.Cert.Case_3_12", "Cgt.Cert.Case_6_3"]
